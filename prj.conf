# Base Zephyr OS Configuration for SUFST BMS
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Hardware Peripherals
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_ADC=y
CONFIG_CAN=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# USB CDC-ACM virtual COM port carrying the Zephyr shell ("bms" commands)
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="SUFST"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="SUFST BMS"
CONFIG_CDC_ACM_SERIAL_SELF_POWERED=y
CONFIG_UART_LINE_CTRL=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
